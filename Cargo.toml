[package]
name = "webshell"
version = "0.4.2"
edition = "2021"
description = "A browser-based login shell with persistent, resumable per-user terminal slots."

[dependencies]
axum = { version = "0.8", features = ["ws"] }
axum-extra = { version = "0.12", features = ["cookie-signed"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["trace"] }
futures = "0.3"
anyhow = "1"
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
clap = { version = "4", features = ["derive", "env"] }
rand = "0.10"
subtle = "2"
base64 = "0.23"
# For the trusted-device cookie's Max-Age. Already in the tree via `cookie`;
# named here because we construct a Duration ourselves.
time = "0.3"
hmac = "0.13"
sha2 = "0.11"
sha1 = "0.11"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
bcrypt = "0.19"
argon2 = "0.6"
# `rustls-no-provider` keeps aws-lc-rs (a C/cmake build) out of the musl
# cross-builds; main() installs ring, which rustls-acme already uses.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "form", "query"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
libc = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
axum-server = "0.8"
rustls-acme = { version = "0.15", default-features = false, features = ["axum", "ring", "tls12", "webpki-roots"] }
vt100 = "0.18"

[dev-dependencies]
tokio-tungstenite = "0.30"
