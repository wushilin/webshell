<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="referrer" content="same-origin" />
  <title>webshell · login</title>
  <link rel="icon" href="/webshell/favicon.ico" sizes="any" />
  <style>
    :root { color-scheme: light dark; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      display: grid; place-items: center; min-height: 100vh; margin: 0;
      background: #0f1115; color: #e6e6e6;
    }
    .card {
      background: #1a1d24; padding: 2rem 2.25rem; border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0,0,0,.5); width: min(90vw, 340px);
    }
    h1 { font-size: 1.25rem; margin: 0 0 1.25rem; font-weight: 600; }
    label { display: block; font-size: .8rem; margin: .75rem 0 .25rem; color: #9aa0aa; }
    input {
      width: 100%; box-sizing: border-box; padding: .6rem .7rem; border-radius: 8px;
      border: 1px solid #2c313c; background: #0f1115; color: #e6e6e6; font-size: .95rem;
    }
    input:focus { outline: 2px solid #4c8bf5; border-color: transparent; }
    button {
      margin-top: 1.25rem; width: 100%; padding: .65rem; border: 0; border-radius: 8px;
      background: #4c8bf5; color: #fff; font-size: .95rem; font-weight: 600; cursor: pointer;
    }
    button:hover { background: #3f7be0; }
    button:disabled { background: #39414f; color: #b7bdc8; cursor: progress; }
    .error { color: #ff6b6b; font-size: .85rem; margin: .75rem 0 0; }
  </style>
</head>
<body>
  <form class="card" method="post" action="/webshell/login" autocomplete="off">
    <h1>webshell</h1>
    <!--ERROR-->
    <label for="username">Username</label>
    <input id="username" name="username" type="text" autocomplete="username" autofocus required />
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required />
    {{OTP_FIELD}}
    <input type="hidden" name="csrf" value="{{CSRF}}" />
    <p class="error" id="clientError" hidden></p>
    <button id="signin" type="submit">Sign in</button>
  </form>
  <script nonce="{{NONCE}}">
    // Sign-in is deliberately slow — PAM runs serialized behind a tarpit delay
    // — so without feedback the button looks dead and gets clicked again. The
    // second click resubmits the same one-time code, which the server now
    // refuses as a replay. Show the request is in flight and allow only one.
    // A native form POST that is written into a keep-alive socket the network
    // has already dropped is simply lost: the browser will not retry a POST,
    // so it sits "pending" until it times out, and the page looks dead. That
    // is the "click twice" behaviour — the second click opened a fresh
    // connection. Owning the request lets us retry it on a new one instead.
    (function () {
      const form = document.querySelector("form");
      const btn = document.getElementById("signin");
      const clientError = document.getElementById("clientError");
      const LABEL = "Sign in";
      let sent = false;

      function rearm() {
        sent = false;
        btn.disabled = false;
        btn.textContent = LABEL;
      }

      function fail(message) {
        clientError.textContent = message;
        clientError.hidden = false;
        rearm();
      }

      // A rejected fetch means no response was received at all, so the request
      // almost certainly never reached the server — safe to send again. A
      // response of any status is final: retrying it could spend a second
      // one-time code.
      async function post(body) {
        try {
          return await fetch(form.action, {
            method: "POST", body, credentials: "same-origin",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
          });
        } catch (_) {
          return await fetch(form.action, {
            method: "POST", body, credentials: "same-origin",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
          });
        }
      }

      form.addEventListener("submit", async (e) => {
        if (sent) { e.preventDefault(); return; }
        if (!form.checkValidity()) return;   // let the browser report it; stay armed
        e.preventDefault();                  // from here the fetch owns it
        sent = true;
        clientError.hidden = true;
        btn.disabled = true;
        btn.textContent = "Signing in…";

        let res;
        try {
          res = await post(new URLSearchParams(new FormData(form)));
        } catch (_) {
          fail("Could not reach the server. Check your connection and try again.");
          return;
        }
        // Authenticated: fetch followed the redirect, so go where it landed.
        if (res.redirected) {
          window.location.assign(res.url);
          return;
        }
        // A stale CSRF (an old tab, or a session that rotated underneath us)
        // is answered as plain text; only a reload can supply a fresh one.
        if (res.status === 403) {
          window.location.reload();
          return;
        }
        // Otherwise the server re-rendered the form with an error. Adopt its
        // message and its new CSRF in place, rather than replacing the
        // document — this page's script nonce belongs to *this* response.
        try {
          const doc = new DOMParser().parseFromString(await res.text(), "text/html");
          const message = doc.querySelector(".error");
          const csrf = doc.querySelector('input[name="csrf"]');
          if (csrf) form.querySelector('input[name="csrf"]').value = csrf.value;
          fail(message ? message.textContent.trim() : "Sign-in failed. Please try again.");
        } catch (_) {
          fail("Sign-in failed. Please try again.");
        }
        form.querySelector("#otp")?.focus();
      });

      // Back-navigation can restore this page from the bfcache mid-submit.
      window.addEventListener("pageshow", rearm);
    })();
  </script>
</body>
</html>
