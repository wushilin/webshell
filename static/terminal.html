<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="referrer" content="same-origin" />
  <title>webshell</title>
  <link rel="icon" href="/webshell/favicon.ico" sizes="any" />
  <link rel="stylesheet" href="/webshell/static/xterm.css" />
  <style>
    /* overscroll-behavior: kill pull-to-refresh / rubber-banding — a swipe
       must never reload the page, even on gestures the app doesn't own. */
    html, body { height: 100%; margin: 0; background: #000; color: #cbd0d8; overscroll-behavior: none; }
    #bar {
      display: flex; align-items: center; gap: .5rem; flex-wrap: wrap;
      padding: .4rem .6rem; background: #14171d;
      font: .8rem system-ui, sans-serif; box-sizing: border-box;
      border-bottom: 1px solid #23272f;
      position: relative; z-index: 35;
    }
    #bar strong { margin-right: .25rem; }
    #bar .user { color: #9aa0aa; }
    #bar .grow { flex: 1; }
    .slots { display: flex; gap: .25rem; }
    .slot {
      width: 30px; height: 26px; border: 1px solid #2c313c; border-radius: 6px;
      background: #0f1115; color: #7d828c; cursor: pointer; font: inherit; position: relative;
    }
    /* a slot whose shell is running (per the server) */
    .slot.running { color: #cbd0d8; border-color: #34506e; }
    .slot.running::after {
      content: ""; position: absolute; top: 3px; right: 3px; width: 6px; height: 6px;
      border-radius: 50%; background: #7ecb7e;
    }
    .slot.active { background: #4c8bf5; color: #fff; border-color: #4c8bf5; }
    .slot.active.running::after { background: #eafbea; }
    label.ro { display: flex; align-items: center; gap: .3rem; user-select: none; cursor: pointer; }
    button.action {
      background: transparent; border: 1px solid #2c313c; color: #cbd0d8;
      border-radius: 6px; padding: .25rem .6rem; cursor: pointer; font: inherit;
    }
    button.action:hover { border-color: #4c8bf5; }
    button.action.danger { color: #e58f8f; }
    button.action.danger:hover { border-color: #ff6b6b; color: #ff6b6b; }
    #status { min-width: 6.5rem; text-align: right; color: #7ecb7e; }
    #status.down { color: #ff6b6b; }
    #status.wait { color: #e0b34c; }
    form.logout { margin: 0; }
    /* All session panes stack in the same area; only the active one shows. */
    #panes { position: absolute; left: 0; right: 0; bottom: 0; top: 46px; }
    .pane { position: absolute; inset: 0; padding: 4px; display: none; }
    .pane.visible { display: block; }
    #more { display: none; }
    @media (max-width: 640px) {
      #bar strong, #bar .user { display: none; }
      #more { display: inline-block; }
      .slots { overflow-x: auto; min-width: 0; }
      #bar { flex-wrap: nowrap; }
      #status { min-width: 0; font-size: 0; }
      #status::before {
        content: ""; display: inline-block; width: 10px; height: 10px;
        border-radius: 50%; background: #7ecb7e; vertical-align: middle;
      }
      #status.wait::before { background: #e0b34c; animation: statusblink 1s infinite; }
      #status.down::before { background: #ff6b6b; }
    }
    @keyframes statusblink { 50% { opacity: .25; } }

    /* Modals: the share flow and the generic confirm/alert dialog */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,.6);
      display: grid; place-items: center; z-index: 50;
      animation: modalfade .12s ease-out;
    }
    .modal-overlay[hidden] { display: none; }
    .modal {
      background: #1a1d24; border: 1px solid #2c313c; border-radius: 12px;
      padding: 1.2rem 1.4rem; width: min(92vw, 420px);
      font: .85rem system-ui, sans-serif; color: #e6e6e6;
      box-shadow: 0 12px 48px rgba(0,0,0,.55);
      animation: modalpop .12s ease-out;
    }
    @keyframes modalfade { from { opacity: 0; } }
    @keyframes modalpop { from { opacity: 0; transform: translateY(6px) scale(.98); } }
    @media (prefers-reduced-motion: reduce) {
      .modal-overlay, .modal { animation: none; }
    }
    .modal h3 { margin: 0 0 .3rem; font-size: 1rem; }
    .modal .modal-sub { color: #9aa0aa; margin: .2rem 0 .9rem; font-size: .8rem; }
    .ttl-row { display: flex; flex-wrap: wrap; gap: .4rem; }
    .ttl {
      flex: 1 1 auto; padding: .45rem .5rem; border: 1px solid #2c313c;
      border-radius: 8px; background: #0f1115; color: #cbd0d8; cursor: pointer; font: inherit;
    }
    .ttl.sel { border-color: #4c8bf5; background: #22304a; color: #fff; }
    #customRow { margin: .7rem 0 0; }
    #customRow input {
      width: 9rem; padding: .35rem .5rem; border: 1px solid #2c313c;
      border-radius: 6px; background: #0f1115; color: #e6e6e6;
    }
    .modal-actions { display: flex; gap: .5rem; margin-top: 1.1rem; }
    .modal-actions .action { flex: 1; padding: .5rem; text-align: center; }
    .action.primary { background: #4c8bf5; color: #fff; border-color: #4c8bf5; }
    .action.primary:hover { background: #3f7be0; }
    /* Confirm button for an irreversible action (kill / close a shell). */
    .action.destructive { background: #b3423c; color: #fff; border-color: #b3423c; }
    .action.destructive:hover { background: #9c3833; border-color: #9c3833; }
    .action:focus-visible { outline: 2px solid #7fa8f5; outline-offset: 2px; }
    /* The generic dialog stacks above the share modal (it can be raised from it). */
    #dialogModal { z-index: 60; }
    #dialogBody { margin-bottom: 0; }
    #dialogBody strong { color: #e6e6e6; }
    #shareUrl {
      width: 100%; box-sizing: border-box; padding: .5rem; border: 1px solid #2c313c;
      border-radius: 6px; background: #0f1115; color: #e6e6e6;
      font-family: ui-monospace, monospace; font-size: .8rem;
    }
    /* Display-settings popover */
    .cog-panel {
      position: absolute; top: 44px; right: 8px; z-index: 40;
      background: #1a1d24; border: 1px solid #2c313c; border-radius: 10px;
      padding: .7rem .8rem; font: .8rem system-ui, sans-serif; color: #e6e6e6;
      box-shadow: 0 10px 32px rgba(0,0,0,.5); display: grid; gap: .55rem;
    }
    .cog-panel[hidden] { display: none; }
    .cog-panel label { display: flex; align-items: center; justify-content: space-between; gap: .8rem; }
    .cog-panel input, .cog-panel select {
      background: #0f1115; border: 1px solid #2c313c; color: #e6e6e6;
      border-radius: 6px; padding: .25rem .4rem; font: inherit;
    }
    .cog-panel input[type=number] { width: 4rem; }
    /* Mobile soft-key bar: sits at the bottom of the *visible* viewport,
       above the soft keyboard when it is open. */
    #keybar {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
      display: flex; gap: .25rem; padding: .3rem .4rem; box-sizing: border-box;
      background: #14171d; border-top: 1px solid #23272f;
    }
    #keybar[hidden] { display: none; }
    #keybar button {
      flex: 1; min-width: 0; height: 34px; border: 1px solid #2c313c; border-radius: 6px;
      background: #0f1115; color: #cbd0d8; font: .8rem ui-monospace, monospace;
      touch-action: manipulation; padding: 0;
    }
    #keybar button.armed { background: #4c8bf5; color: #fff; border-color: #4c8bf5; }
  </style>
</head>
<body>
  <div id="bar">
    <strong>webshell</strong>
    <span class="user">{{USER}}</span>
    <div class="slots" id="slots"></div>
    <label class="ro" id="roLabel"><input type="checkbox" id="ro" /> read-only</label>
    <button class="action" id="share" title="Create a read-only share link for this slot">share</button>
    <button class="action" id="reset" title="Kill and restart the selected slot">reset</button>
    <button class="action danger" id="del" title="Close the selected slot's shell (no restart)">delete</button>
    <span class="grow" id="grow"></span>
    <span id="status">connecting…</span>
    <button class="action" id="more" title="Menu">⋯</button>
    <button class="action" id="cog" title="Display settings">⚙</button>
    <form class="logout" id="logoutForm" method="post" action="/webshell/private/logout">
      <input type="hidden" name="csrf" value="{{CSRF}}" />
      <button class="action" type="submit">log out</button>
    </form>
  </div>
  <div id="panes"></div>
  <div id="keybar" hidden></div>

  <div id="cogPanel" class="cog-panel" hidden>
    <label>Font size <input type="number" id="fontSize" min="8" max="40" step="1" /></label>
    <label>Font <select id="fontFamily"></select></label>
    <button type="button" class="action primary" id="applyPrefs">Apply</button>
  </div>

  <div id="morePanel" class="cog-panel" hidden></div>

  <div id="shareModal" class="modal-overlay" hidden>
    <div class="modal">
      <h3>Share terminal <span id="shareSlotNum"></span></h3>
      <p class="modal-sub">Creates a <strong>read-only</strong>, login-free link. It works until it expires, even after you log out.</p>
      <div id="shareStep1">
        <div class="ttl-row" id="ttlOpts">
          <button type="button" class="ttl" data-secs="86400">1 day</button>
          <button type="button" class="ttl" data-secs="259200">3 days</button>
          <button type="button" class="ttl" data-secs="604800">7 days</button>
          <button type="button" class="ttl" data-secs="2592000">30 days</button>
          <button type="button" class="ttl" data-secs="custom">Custom…</button>
        </div>
        <div id="customRow" hidden>
          <label>Seconds: <input type="number" id="customSecs" min="1" max="31536000" placeholder="e.g. 3600" /></label>
        </div>
        <div class="modal-actions">
          <button type="button" class="action primary" id="shareCreate">Create link</button>
          <button type="button" class="action" id="shareCancel">Cancel</button>
        </div>
      </div>
      <div id="shareStep2" hidden>
        <p class="modal-sub">Expires in <span id="shareExpiry"></span>. Copied to clipboard.</p>
        <input id="shareUrl" readonly />
        <div class="modal-actions">
          <button type="button" class="action primary" id="shareCopy">Copy link</button>
          <button type="button" class="action" id="shareDone">Done</button>
        </div>
      </div>
    </div>
  </div>

  <div id="dialogModal" class="modal-overlay" hidden>
    <div class="modal" role="alertdialog" aria-modal="true"
         aria-labelledby="dialogTitle" aria-describedby="dialogBody">
      <h3 id="dialogTitle"></h3>
      <p class="modal-sub" id="dialogBody"></p>
      <div class="modal-actions">
        <button type="button" class="action primary" id="dialogOk">OK</button>
        <button type="button" class="action" id="dialogCancel">Cancel</button>
      </div>
    </div>
  </div>

  <script src="/webshell/static/xterm.js"></script>
  <script src="/webshell/static/addon-fit.js"></script>
  <script nonce="{{NONCE}}">
    const CSRF = "{{CSRF}}";
    const SLOTS = parseInt("{{SLOTS}}", 10) || 1;
    const MAX_FAILURES = 30;  // consecutive failed connects before giving up

    // Display preferences (font size/family), persisted in localStorage.
    const TermPrefs = (function () {
      const FONTS = [
        ["System mono", "ui-monospace, SFMono-Regular, Menlo, monospace"],
        ["Menlo", "Menlo, monospace"],
        ["Consolas", "Consolas, monospace"],
        ["Courier New", "'Courier New', monospace"],
        ["DejaVu Sans Mono", "'DejaVu Sans Mono', monospace"],
        ["Monospace", "monospace"],
      ];
      const KEY = "webshell.term";
      const DEF = { fontSize: 14, fontFamily: FONTS[0][1] };
      function load() {
        try { return Object.assign({}, DEF, JSON.parse(localStorage.getItem(KEY) || "{}")); }
        catch (_) { return Object.assign({}, DEF); }
      }
      function save(p) {
        try { localStorage.setItem(KEY, JSON.stringify({ fontSize: p.fontSize, fontFamily: p.fontFamily })); }
        catch (_) {}
      }
      function wireControls(prefs, onChange) {
        const cog = document.getElementById("cog");
        const panel = document.getElementById("cogPanel");
        const sizeEl = document.getElementById("fontSize");
        const famEl = document.getElementById("fontFamily");
        FONTS.forEach(([label, val]) => {
          const o = document.createElement("option"); o.value = val; o.textContent = label; famEl.appendChild(o);
        });
        const applyEl = document.getElementById("applyPrefs");
        sizeEl.value = prefs.fontSize;
        famEl.value = prefs.fontFamily;
        cog.addEventListener("click", (e) => { e.stopPropagation(); panel.hidden = !panel.hidden; });
        document.addEventListener("click", (e) => {
          if (!panel.hidden && !panel.contains(e.target) && e.target !== cog) panel.hidden = true;
        });
        // Changes take effect only on Apply.
        applyEl.addEventListener("click", () => {
          let v = parseInt(sizeEl.value, 10); if (!v || v < 8) v = 8; if (v > 40) v = 40;
          sizeEl.value = v;
          prefs.fontSize = v;
          prefs.fontFamily = famEl.value;
          save(prefs);
          onChange();
          panel.hidden = true;
        });
      }
      return { load, wireControls };
    })();
    const prefs = TermPrefs.load();

    const statusEl = document.getElementById("status");
    const slotsEl = document.getElementById("slots");
    const panesEl = document.getElementById("panes");
    const roEl = document.getElementById("ro");
    const enc = new TextEncoder();

    // One independent, always-connected session per slot, created lazily on
    // first visit and kept alive afterward — so switching between opened slots
    // is instant (no repaint) and background slots stay live.
    const sessions = new Array(SLOTS).fill(null);
    let active = 0;

    function setStatus(text, cls) {
      statusEl.textContent = text;
      statusEl.title = text;
      statusEl.className = cls || "";
    }
    function markActive() {
      slotBtns.forEach((b, i) => b.classList.toggle("active", i === active));
    }
    function refreshStatus() {
      if (Conn.failures >= MAX_FAILURES) { setStatus("connection lost — reload", "down"); return; }
      if (!Conn.ws) { setStatus("connecting…", "wait"); return; }
      switch (Conn.ws.readyState) {
        case WebSocket.OPEN: {
          const s = sessions[active];
          setStatus(s && s.readOnly ? "read-only" : "connected");
          break;
        }
        case WebSocket.CONNECTING: setStatus("connecting…", "wait"); break;
        default: setStatus("reconnecting…", "wait");
      }
    }

    async function refreshSlots() {
      try {
        const res = await fetch("/webshell/private/api/terminals", { credentials: "same-origin" });
        if (res.status === 401) {
          // Logged out (elsewhere), session expired, or server restarted:
          // the ws upgrade will 401 forever, so retrying is pointless.
          // A network outage never lands here — fetch throws into the catch
          // below and the normal reconnect loop keeps trying.
          setStatus("logged out", "down");
          location.replace("/webshell/login");
          return;
        }
        if (!res.ok) return;
        const list = await res.json();
        list.forEach((s) => {
          if (slotBtns[s.index]) slotBtns[s.index].classList.toggle("running", s.running);
        });
      } catch (_) { /* ignore */ }
    }

    // Coalesced refresh: a reconnect re-opens every slot at once, so the
    // per-slot hellos would otherwise fire one fetch each.
    let slotsRefreshTimer = null;
    function scheduleSlotsRefresh() {
      clearTimeout(slotsRefreshTimer);
      slotsRefreshTimer = setTimeout(refreshSlots, 50);
    }

    function wsUrl() {
      const proto = location.protocol === "https:" ? "wss:" : "ws:";
      return `${proto}//${location.host}/webshell/private/ws?csrf=${encodeURIComponent(CSRF)}`;
    }

    // ---- single multiplexed connection: every opened slot rides this one
    // socket. Binary frames carry a 1-byte slot prefix; JSON text frames
    // carry control (open/resize/mode/close up, hello/closed down). The
    // reconnect loop, give-up state, logout probe and status ball all
    // describe this one socket now. ----
    const Conn = {
      ws: null,
      generation: 0,          // orphans superseded sockets' handlers
      reconnectDelay: 500,
      reconnectTimer: null,
      failures: 0,            // consecutive failed cycles; MAX_FAILURES = give up

      isOpen() { return !!this.ws && this.ws.readyState === WebSocket.OPEN; },

      connect() {
        clearTimeout(this.reconnectTimer);
        const myGen = ++this.generation;
        const sock = new WebSocket(wsUrl());
        this.ws = sock;
        sock.binaryType = "arraybuffer";
        refreshStatus();

        sock.onopen = () => {
          if (myGen !== this.generation) return;
          this.reconnectDelay = 500;
          this.failures = 0;
          // Restore every slot the user has opened; each resumes from its
          // own offset (delta) or replays in full — one round trip.
          // Re-open live slots; a dead background slot stays dead until the
          // user activates it (respawning it silently would be a surprise).
          // The dead ACTIVE slot must re-open here: its delayed respawn
          // timer no-ops while the socket is down, so this is its only
          // revival path after a reconnect.
          sessions.forEach((s) => {
            if (s && s.opened && (!s.dead || s.isActive())) s.sendOpen();
          });
          refreshSlots();
          refreshStatus();
          const a = sessions[active];
          if (a) a.term.focus();
        };
        sock.onmessage = (ev) => {
          if (myGen !== this.generation) return;
          if (typeof ev.data === "string") {
            let m;
            try { m = JSON.parse(ev.data); } catch (_) { return; }
            const s = sessions[m.term];
            if (!s) return;
            if (m.type === "hello") s.onHello(m);
            else if (m.type === "closed") s.onClosed(m);
            return;
          }
          const data = new Uint8Array(ev.data);
          if (!data.length) return;
          const s = sessions[data[0]];
          if (s) s.onOutput(data.subarray(1));
        };
        sock.onclose = () => {
          if (myGen !== this.generation) return;  // superseded socket: stay closed
          refreshSlots();                          // also probes auth: 401 -> login
          this.failures++;
          if (this.failures >= MAX_FAILURES) {
            // Give up: stop auto-retrying until the page is reloaded.
            refreshStatus();
            return;
          }
          refreshStatus();
          this.reconnectTimer = setTimeout(() => this.connect(), this.reconnectDelay);
          this.reconnectDelay = Math.min(this.reconnectDelay * 2, 5000);
        };
        sock.onerror = () => { try { sock.close(); } catch (_) {} };
      },

      sendJson(obj) { if (this.isOpen()) this.ws.send(JSON.stringify(obj)); },
      // A paste reaches us from xterm as ONE onData string, so this is the only
      // place a client frame gets big. Split it: the server bounds a single
      // WebSocket message, and the PTY takes a byte stream anyway — the frames
      // are written to the master in order, so splitting mid-character is
      // harmless and the shell sees an identical byte sequence.
      sendInput(index, text) {
        if (!this.isOpen()) return;
        const b = enc.encode(text);
        const MAX = 32 * 1024;
        for (let off = 0; off < b.length || off === 0; off += MAX) {
          const part = b.subarray(off, Math.min(off + MAX, b.length));
          const f = new Uint8Array(part.length + 1);
          f[0] = index;
          f.set(part, 1);
          this.ws.send(f);
          if (b.length === 0) break;   // keepalive/empty input: send one frame
        }
      },

      drop() {
        this.generation++;
        clearTimeout(this.reconnectTimer);
        if (this.ws) {
          this.ws.onmessage = null;   // no late frames into any term
          try { this.ws.close(); } catch (_) {}
          this.ws = null;
        }
      },
      reconnect() { this.failures = 0; this.reconnectDelay = 500; this.drop(); this.connect(); },
    };

    class Session {
      constructor(index) {
        this.index = index;
        this.readOnly = false;
        this.opened = false;      // user has visited this slot; re-open on reconnect
        this.dead = false;        // server closed the channel; re-open respawns
        this.epoch = null;        // shell-instance id from the last hello
        this.offset = 0;          // stream bytes received (the resume checkpoint)
        this.awaitingHello = false; // open sent; drop data frames until the hello
        this.expectFirst = false; // next data frame is the replay/delta blob
        this.reopenTimer = null;
        this.closing = false;     // user asked to delete: no respawn on close
        // Suppress xterm report replies while the replay frame is parsed.
        this.suppressReports = false;

        this.pane = document.createElement("div");
        this.pane.className = "pane";
        // xterm must be opened on a visible, laid-out element — opening while
        // display:none leaves the renderer with 0-size cell metrics and a
        // black screen that only a real window resize repairs.
        if (this.isActive()) this.pane.classList.add("visible");
        panesEl.appendChild(this.pane);

        this.term = new Terminal({
          cursorBlink: true,
          fontFamily: prefs.fontFamily,
          fontSize: prefs.fontSize,
          scrollback: 5000,
          theme: { background: "#000000" },
        });
        this.fit = new FitAddon.FitAddon();
        this.term.loadAddon(this.fit);
        this.term.open(this.pane);

        // Best-effort: keep mobile autofill (passwords/cards/addresses) and
        // text suggestions away from xterm's hidden textarea. The browser's
        // keyboard accessory UI is not fully page-controllable.
        const ta = this.pane.querySelector(".xterm-helper-textarea");
        if (ta) {
          ta.setAttribute("autocomplete", "off");
          ta.setAttribute("autocorrect", "off");
          ta.setAttribute("autocapitalize", "none");
          ta.setAttribute("spellcheck", "false");
          ta.setAttribute("name", "xt-" + this.index);
          ta.setAttribute("data-form-type", "other");
          ta.setAttribute("data-lpignore", "true");
        }

        this.term.onData((d) => this.input(d));
        this.term.onResize(() => this.sendResize());
        // Keep the keyboard shift-clamp honest as the cursor row changes.
        this.term.onCursorMove(() => { if (this.isActive()) scheduleLayout(); });

        // Touch scrollback: one-finger drag drives xterm's own scrollable
        // viewport by raw pixel deltas — content tracks the finger 1:1 —
        // with a momentum fling on release. xterm 5.5 registers its own
        // touch handlers on term.element (a child of this.pane); capturing
        // here + stopPropagation on move keeps the pane the single owner of
        // the gesture so xterm's handler can't double-scroll or fight
        // zoom-pan.
        this.viewport = this.pane.querySelector(".xterm-viewport");
        this.touchY = null;
        this.touchT = 0;
        this.touchV = 0;          // px/ms, low-passed drag velocity
        this.flinging = false;
        this.pane.addEventListener("touchstart", (e) => {
          this.flinging = false;  // any touch stops a fling
          this.touchV = 0;
          this.touchT = e.timeStamp;
          this.touchY = e.touches.length === 1 ? e.touches[0].clientY : null;
        }, { passive: true, capture: true });
        this.pane.addEventListener("touchmove", (e) => {
          if (this.touchY === null || e.touches.length !== 1) return;
          e.stopPropagation();
          const vv = window.visualViewport;
          if (vv && vv.scale > 1.01) return;   // zoomed: finger pans the page
          const touch = e.touches[0];
          const y = touch.clientY;
          const dy = y - this.touchY;
          const dt = Math.max(1, e.timeStamp - this.touchT);
          this.touchY = y;
          this.touchT = e.timeStamp;
          if (this.term.buffer.active.type === "alternate") {
            // vim/less/claude-code: no scrollback to drag. Re-emit the drag
            // as wheel events into xterm's pipeline, which delivers them the
            // way the app expects: mouse-wheel reports if it enabled mouse
            // tracking, up/down arrow keys otherwise. Finger down = wheel up.
            this.term.element.dispatchEvent(new WheelEvent("wheel", {
              bubbles: true, cancelable: true, deltaMode: 0,
              deltaY: -dy, clientX: touch.clientX, clientY: y,
            }));
            e.preventDefault();
            return;
          }
          if (!this.viewport) return;
          this.viewport.scrollTop -= dy;
          this.touchV = 0.8 * (dy / dt) + 0.2 * this.touchV;
          e.preventDefault();
        }, { passive: false, capture: true });
        this.pane.addEventListener("touchend", (e) => {
          // Age-check the last move: drag-hold-lift must not fling on stale
          // velocity — only a genuine flick (recent movement) does.
          if (this.touchY !== null && Math.abs(this.touchV) > 0.05 &&
              e.timeStamp - this.touchT < 100) this.fling();
          this.touchY = null;
        }, { passive: true, capture: true });
        this.pane.addEventListener("touchcancel", () => {
          this.touchY = null; this.touchV = 0;
        }, { passive: true, capture: true });
      }

      isActive() { return active === this.index; }

      sendResize() {
        if (!this.readOnly && this.opened) {
          Conn.sendJson({ type: "resize", term: this.index, cols: this.term.cols, rows: this.term.rows });
        }
      }

      // Momentum fling: keep scrolling after release with exponential decay
      // until the velocity fades or a new touch interrupts.
      fling() {
        if (this.flinging || !this.viewport) return;
        this.flinging = true;
        let last = performance.now();
        const step = (now) => {
          if (!this.flinging) return;
          const dt = now - last;
          last = now;
          this.touchV *= Math.pow(0.94, dt / 16.7);
          if (Math.abs(this.touchV) < 0.02 ||
              this.term.buffer.active.type === "alternate") {
            this.flinging = false;
            return;
          }
          this.viewport.scrollTop -= this.touchV * dt;
          requestAnimationFrame(step);
        };
        requestAnimationFrame(step);
      }

      // Single entry point for keystrokes (typed or key-bar): applies the
      // one-shot Ctrl modifier, then forwards to the socket.
      input(d) {
        if (this.suppressReports) return;
        if (ctrlArmed || shiftArmed) {
          if (ctrlArmed && d.length === 1) d = ctrlTransform(d);
          // One-shot: any chunk consumes both modifiers. Typed characters
          // have no bar-shift form — the native keyboard's shift owns them.
          setCtrl(false); setShift(false);
        }
        if (!this.readOnly) Conn.sendInput(this.index, d);
      }

      // Fit to the current viewport. Only meaningful while the pane is visible.
      fitAndResize() {
        try { this.fit.fit(); } catch (_) { /* hidden/0-size */ }
        this.sendResize();
      }

      // Ask the server to (re)attach this slot over the mux connection,
      // resuming from our offset when the server still can.
      sendOpen() {
        clearTimeout(this.reopenTimer);
        this.dead = false;
        // Frames for this slot arriving before the hello are a previous
        // attachment's stream (re-open race); writing them would duplicate
        // output and corrupt the offset. Drop until the hello re-syncs us.
        this.awaitingHello = true;
        const msg = {
          type: "open", term: this.index,
          cols: this.term.cols, rows: this.term.rows,
          ro: this.readOnly,
        };
        if (this.epoch !== null) { msg.epoch = this.epoch; msg.offset = this.offset; }
        Conn.sendJson(msg);
      }

      onHello(m) {
        this.awaitingHello = false;
        this.epoch = m.epoch;
        this.offset = m.offset;
        this.expectFirst = true;
        // resume: the stream continues exactly where we left off — keep the
        // screen, scroll position and all. replay: different shell or missed
        // window — redraw from scratch.
        if (m.mode === "replay") this.term.reset();
        if (this.isActive()) refreshStatus();
        // The slot is live as of this hello — paint it green now instead of
        // waiting out the 5s poll.
        scheduleSlotsRefresh();
      }

      onOutput(data) {
        if (this.awaitingHello) return;  // stale frames from a replaced attachment
        this.offset += data.length;
        if (this.expectFirst) {
          // Replay/delta blob (sent even when empty): suppress terminal
          // report replies so answers to historical color/status queries are
          // not injected into the live shell.
          this.expectFirst = false;
          this.suppressReports = true;
          const clear = () => { this.suppressReports = false; };
          this.term.write(data, clear);
          setTimeout(clear, 300);
        } else {
          this.term.write(data);
        }
      }

      // Tear the slot down after a user-requested delete: drop the resume
      // state so the next visit starts a clean shell, and clear `opened` so
      // neither the reconnect loop nor activate() revives it behind the
      // user's back. Idempotent — the closed frame and the POST reply race,
      // and whichever lands second must not repeat the notice.
      markClosed() {
        clearTimeout(this.reopenTimer);
        this.closing = false;
        this.awaitingHello = false;
        this.dead = true;
        this.epoch = null;
        this.offset = 0;
        if (!this.opened) return;
        this.opened = false;
        this.term.reset();
        this.term.write("\x1b[90m[terminal " + (this.index + 1) +
          " closed — select this slot to start a new shell]\x1b[0m\r\n");
        scheduleSlotsRefresh();
      }

      onClosed(m) {
        // Deleted on purpose: stay closed instead of respawning.
        if (this.closing) { this.markClosed(); return; }
        // Shell exited / was reset ("exit") or attach failed ("error").
        // Keep epoch/offset: the next open carries them so the server can
        // decide delta vs. full replay via its epoch check. If the shell
        // really did respawn, the epoch mismatch forces a full replay
        // anyway, so retaining stale state here is always safe.
        this.dead = true;
        refreshSlots();
        if (!this.isActive()) return;   // background: re-opened on activation
        // Respawn the visible slot on a small delay so a crash-looping or
        // unspawnable shell cannot hot-loop open/closed cycles.
        clearTimeout(this.reopenTimer);
        this.reopenTimer = setTimeout(() => {
          if (this.isActive() && this.dead && Conn.isOpen()) this.sendOpen();
        }, m.reason === "error" ? 2000 : 500);
      }
    }

    // Build slot buttons.
    const slotBtns = [];
    for (let i = 0; i < SLOTS; i++) {
      const b = document.createElement("button");
      b.className = "slot";
      b.textContent = i + 1;
      b.title = "Terminal " + (i + 1);
      b.addEventListener("click", () => activate(i));
      slotsEl.appendChild(b);
      slotBtns.push(b);
    }

    // ---- compact top bar: on narrow screens the right-side controls live
    // in the ⋯ popover; on wide screens they sit inline. The elements are
    // moved, not cloned, so their listeners survive the transition. ----
    const barEl = document.getElementById("bar");
    const moreBtn = document.getElementById("more");
    const morePanel = document.getElementById("morePanel");
    const growEl = document.getElementById("grow");
    const roLabel = document.getElementById("roLabel");
    const shareBtn = document.getElementById("share");
    const resetBtn = document.getElementById("reset");
    const delBtn = document.getElementById("del");
    const cogBtn = document.getElementById("cog");
    const logoutForm = document.getElementById("logoutForm");
    const narrow = window.matchMedia("(max-width: 640px)");

    function layoutBar() {
      if (narrow.matches) {
        [roLabel, shareBtn, resetBtn, delBtn, cogBtn, logoutForm].forEach((el) => morePanel.appendChild(el));
      } else {
        morePanel.hidden = true;
        [roLabel, shareBtn, resetBtn, delBtn].forEach((el) => barEl.insertBefore(el, growEl));
        barEl.appendChild(cogBtn);
        barEl.appendChild(logoutForm);
      }
      panesEl.style.top = barEl.offsetHeight + "px";
    }
    moreBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      document.getElementById("cogPanel").hidden = true;
      morePanel.hidden = !morePanel.hidden;
    });
    document.addEventListener("click", (e) => {
      if (!morePanel.hidden && !morePanel.contains(e.target) && e.target !== moreBtn) morePanel.hidden = true;
    });
    // Opening display settings from inside the menu: close the menu so the
    // two popovers don't stack in the same corner.
    cogBtn.addEventListener("click", () => { morePanel.hidden = true; });
    narrow.addEventListener("change", layoutBar);
    layoutBar();

    // ---- mobile key bar (touch devices only) ----
    const keyBar = document.getElementById("keybar");
    let ctrlArmed = false, shiftArmed = false;
    let ctrlBtn = null, shiftBtn = null;

    function setCtrl(on) {
      ctrlArmed = on;
      if (ctrlBtn) ctrlBtn.classList.toggle("armed", on);
    }
    function setShift(on) {
      shiftArmed = on;
      if (shiftBtn) shiftBtn.classList.toggle("armed", on);
    }
    // Map a keystroke to its control byte: letters and @[\]^_ use code&31,
    // ? maps to DEL; anything else passes through unchanged.
    function ctrlTransform(d) {
      if (d === "?") return "\x7f";
      const code = d.toUpperCase().charCodeAt(0);
      if (code >= 64 && code <= 95) return String.fromCharCode(code & 31);
      return d;
    }
    // CSI final bytes for arrows, used for modifier encoding.
    const ARROWS = { "\x1b[A": "A", "\x1b[B": "B", "\x1b[D": "D", "\x1b[C": "C" };
    const KEYS = [
      ["esc", "\x1b"], ["tab", "\t"], ["ctrl", "MOD_CTRL"], ["shift", "MOD_SHIFT"],
      ["↑", "\x1b[A"], ["↓", "\x1b[B"], ["←", "\x1b[D"], ["→", "\x1b[C"],
    ];
    KEYS.forEach(([label, seq]) => {
      const b = document.createElement("button");
      b.textContent = label;
      // pointerdown + preventDefault: never move focus, so the soft
      // keyboard stays up while tapping bar keys.
      b.addEventListener("pointerdown", (e) => {
        e.preventDefault();
        if (seq === "MOD_CTRL") { setCtrl(!ctrlArmed); return; }
        if (seq === "MOD_SHIFT") { setShift(!shiftArmed); return; }
        const s = sessions[active];
        if (!s) return;
        let out = seq;
        // Armed modifiers give arrows/tab their CSI-modified forms here; the
        // generic one-shot consumption in input() covers every other key.
        const mod = 1 + (shiftArmed ? 1 : 0) + (ctrlArmed ? 4 : 0);
        if (ARROWS[seq] && mod > 1) {
          out = "\x1b[1;" + mod + ARROWS[seq];
          setCtrl(false); setShift(false);
        } else if (seq === "\t" && shiftArmed) {
          out = "\x1b[Z";
          setCtrl(false); setShift(false);
        }
        s.input(out);
      });
      if (seq === "MOD_CTRL") ctrlBtn = b;
      if (seq === "MOD_SHIFT") shiftBtn = b;
      keyBar.appendChild(b);
    });
    if (window.matchMedia("(pointer: coarse) and (hover: none)").matches) keyBar.hidden = false;

    function activate(i) {
      active = i;
      let s = sessions[i];
      if (!s) { s = new Session(i); sessions[i] = s; }

      sessions.forEach((sess, idx) => {
        if (sess) sess.pane.classList.toggle("visible", idx === i);
      });
      markActive();
      roEl.checked = s.readOnly;

      if (!s.opened) {
        s.opened = true;
        if (Conn.isOpen()) s.sendOpen();
      } else if (s.dead && Conn.isOpen()) {
        s.sendOpen();
      }
      // Pane is now visible: fit it to the viewport, then focus. Fitting
      // alone is not enough — if cols/rows come out unchanged, resize() is a
      // no-op and a renderer that went stale while the pane was hidden stays
      // black. Force a full repaint of every row regardless.
      requestAnimationFrame(() => {
        s.fitAndResize();
        s.term.refresh(0, s.term.rows - 1);
        s.term.focus();
        refreshStatus();
      });
    }

    roEl.addEventListener("change", () => {
      const s = sessions[active];
      if (!s) return;
      s.readOnly = roEl.checked;
      s.term.options.disableStdin = s.readOnly;
      // Server-side enforcement flips instantly; no reconnect, no replay.
      Conn.sendJson({ type: "mode", term: s.index, ro: s.readOnly });
      // While read-only, resize() was suppressed — resync the pty now.
      s.sendResize();
      refreshStatus();
    });

    // ---- dialogs: one in-page modal in place of window.confirm/alert. The
    // native ones are styled by the browser (jarring against the rest of the
    // UI), can be suppressed entirely by the user or the embedder, and block
    // the event loop — a suppressed confirm() silently returns false, which
    // would make actions look like they simply do nothing. Promise-based:
    // resolves true when confirmed. ----
    const Dialog = (() => {
      const overlay = document.getElementById("dialogModal");
      const titleEl = document.getElementById("dialogTitle");
      const bodyEl = document.getElementById("dialogBody");
      const okBtn = document.getElementById("dialogOk");
      const cancelBtn = document.getElementById("dialogCancel");
      let resolve = null;        // non-null exactly while a dialog is open
      let restoreFocus = null;

      function close(result) {
        if (!resolve) return;
        const done = resolve;
        resolve = null;
        overlay.hidden = true;
        document.removeEventListener("keydown", onKey, true);
        // Hand focus back to whatever raised the dialog, else to the terminal
        // so typing resumes without a click.
        const back = restoreFocus;
        restoreFocus = null;
        if (back && back.isConnected && !overlay.contains(back)) back.focus();
        else { const s = sessions[active]; if (s) s.term.focus(); }
        done(result);
      }

      function onKey(e) {
        if (e.key === "Escape") {
          e.preventDefault(); e.stopPropagation();
          close(false);
          return;
        }
        if (e.key === "Enter") {
          // Activate whatever is focused rather than always confirming: a
          // destructive dialog opens on Cancel, so Enter backs out of it and
          // confirming stays a deliberate click (or Tab, then Enter).
          e.preventDefault(); e.stopPropagation();
          close(document.activeElement !== cancelBtn);
          return;
        }
        if (e.key !== "Tab") return;
        // Focus trap — the dialog has at most these two controls.
        const btns = cancelBtn.hidden ? [okBtn] : [okBtn, cancelBtn];
        const i = btns.indexOf(document.activeElement);
        e.preventDefault();
        btns[((e.shiftKey ? i - 1 : i + 1) + btns.length) % btns.length].focus();
      }

      overlay.addEventListener("click", (e) => { if (e.target === overlay) close(false); });
      okBtn.addEventListener("click", () => close(true));
      cancelBtn.addEventListener("click", () => close(false));

      function open(opts) {
        close(false);            // never stack two dialogs
        titleEl.textContent = opts.title;
        bodyEl.textContent = opts.body || "";
        bodyEl.hidden = !opts.body;
        okBtn.textContent = opts.ok || "OK";
        okBtn.className = "action " + (opts.destructive ? "destructive" : "primary");
        cancelBtn.hidden = !opts.cancel;
        cancelBtn.textContent = opts.cancel || "Cancel";
        restoreFocus = document.activeElement;
        overlay.hidden = false;
        document.addEventListener("keydown", onKey, true);
        (opts.destructive ? cancelBtn : okBtn).focus();
        return new Promise((r) => { resolve = r; });
      }

      return {
        // {title, body, ok, cancel, destructive} -> Promise<boolean>
        confirm: (opts) => open({ cancel: "Cancel", ...opts }),
        // Single-button notice -> Promise<true> when dismissed.
        alert: (title, body) => open({ title, body, ok: "OK", cancel: null }),
      };
    })();

    // ---- share modal ----
    const shareModal = document.getElementById("shareModal");
    let shareSecs = 86400;

    function humanizeSecs(s) {
      if (s % 86400 === 0) { const d = s / 86400; return d + " day" + (d > 1 ? "s" : ""); }
      if (s % 3600 === 0) { const h = s / 3600; return h + " hour" + (h > 1 ? "s" : ""); }
      if (s % 60 === 0) { const m = s / 60; return m + " minute" + (m > 1 ? "s" : ""); }
      return s + " second" + (s > 1 ? "s" : "");
    }
    function updateTtlSel() {
      document.querySelectorAll("#ttlOpts .ttl").forEach((b) => {
        const v = b.dataset.secs;
        const on = (v === "custom" && shareSecs === "custom") ||
                   (v !== "custom" && Number(v) === shareSecs);
        b.classList.toggle("sel", on);
      });
    }
    function openShareModal() {
      morePanel.hidden = true;
      document.getElementById("shareSlotNum").textContent = active + 1;
      document.getElementById("shareStep1").hidden = false;
      document.getElementById("shareStep2").hidden = true;
      document.getElementById("customRow").hidden = true;
      document.getElementById("customSecs").value = "";
      shareSecs = 86400;
      updateTtlSel();
      shareModal.hidden = false;
    }
    function closeShareModal() { shareModal.hidden = true; }

    document.getElementById("share").addEventListener("click", openShareModal);
    document.getElementById("shareCancel").addEventListener("click", closeShareModal);
    document.getElementById("shareDone").addEventListener("click", closeShareModal);
    shareModal.addEventListener("click", (e) => { if (e.target === shareModal) closeShareModal(); });
    // Escape dismisses it, same as the confirm dialog. Skipped while a dialog
    // sits on top — that one owns the key and closes itself first.
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && !shareModal.hidden) closeShareModal();
    });

    document.querySelectorAll("#ttlOpts .ttl").forEach((b) => {
      b.addEventListener("click", () => {
        if (b.dataset.secs === "custom") {
          shareSecs = "custom";
          document.getElementById("customRow").hidden = false;
          document.getElementById("customSecs").focus();
        } else {
          shareSecs = Number(b.dataset.secs);
          document.getElementById("customRow").hidden = true;
        }
        updateTtlSel();
      });
    });

    document.getElementById("shareCreate").addEventListener("click", async () => {
      let secs = shareSecs;
      if (secs === "custom") {
        const input = document.getElementById("customSecs");
        secs = parseInt(input.value, 10);
        if (!secs || secs < 1) {
          await Dialog.alert("Invalid duration", "Enter a number of seconds — 1 or more.");
          input.focus();
          return;
        }
      }
      const idx = active;
      try {
        const res = await fetch("/webshell/private/api/share", {
          method: "POST", credentials: "same-origin",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: new URLSearchParams({ csrf: CSRF, index: String(idx), ttl_secs: String(secs) }),
        });
        if (!res.ok) {
          await Dialog.alert("Share failed", "The server refused to create the link. Sharing may be disabled, or your session may have expired.");
          return;
        }
        const data = await res.json();
        // The server returns an absolute URL when public_base_url is configured;
        // otherwise a path to resolve against this origin.
        const full = /^https?:\/\//i.test(data.url) ? data.url : location.origin + data.url;
        document.getElementById("shareUrl").value = full;
        document.getElementById("shareExpiry").textContent = humanizeSecs(data.expires_in_secs);
        document.getElementById("shareStep1").hidden = true;
        document.getElementById("shareStep2").hidden = false;
        try { await navigator.clipboard.writeText(full); } catch (_) { /* ignore */ }
        const u = document.getElementById("shareUrl"); u.focus(); u.select();
      } catch (_) {
        await Dialog.alert("Share failed", "Could not reach the server. Check your connection and try again.");
      }
    });

    document.getElementById("shareCopy").addEventListener("click", async () => {
      const u = document.getElementById("shareUrl");
      u.focus(); u.select();
      try { await navigator.clipboard.writeText(u.value); } catch (_) { document.execCommand("copy"); }
    });

    document.getElementById("reset").addEventListener("click", async () => {
      morePanel.hidden = true;
      const i = active;             // pinned across the await
      if (!sessions[i]) return;
      const ok = await Dialog.confirm({
        title: "Restart terminal " + (i + 1) + "?",
        body: "The running shell is killed and a fresh one starts in its place. Anything running in it is lost.",
        ok: "Kill and restart",
        destructive: true,
      });
      if (!ok) return;
      const body = new URLSearchParams({ csrf: CSRF, index: String(i) });
      try {
        await fetch("/webshell/private/api/reset", {
          method: "POST", credentials: "same-origin",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body,
        });
      } catch (_) { /* ignore */ }
      // The server kills the shell; the resulting closed frame drives the
      // respawn (Session.onClosed). Nothing else to do here.
    });

    // Delete: same server call as reset — the slot's shell is killed — but the
    // client stays closed afterwards instead of respawning.
    delBtn.addEventListener("click", async () => {
      morePanel.hidden = true;
      const i = active;
      const s = sessions[i];
      const ok = await Dialog.confirm({
        title: "Close terminal " + (i + 1) + "?",
        body: "Its shell and anything running in it are killed. The slot stays empty until you select it again.",
        ok: "Close terminal",
        destructive: true,
      });
      if (!ok) return;
      if (s) s.closing = true;   // arm before the request: the closed frame can beat the reply
      const body = new URLSearchParams({ csrf: CSRF, index: String(i) });
      try {
        const res = await fetch("/webshell/private/api/reset", {
          method: "POST", credentials: "same-origin",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body,
        });
        if (!res.ok) { if (s) s.closing = false; return; }
      } catch (_) {
        if (s) s.closing = false;
        return;
      }
      // An unattached slot never sends a closed frame, so tear down here too;
      // markClosed() is idempotent when the frame already did it.
      if (s) s.markClosed();
      scheduleSlotsRefresh();
    });

    // ---- keyboard-aware layout: shift panes visually when the soft keyboard
    // opens, instead of resizing them. iOS WebKit does not shrink the layout
    // viewport for the soft keyboard — it scrolls the page instead. Pin the
    // scroll and derive the occluded height from visualViewport. The key bar
    // rides on top of the keyboard, and the panes slide up behind the top bar
    // instead of shrinking. ----
    let layoutQueued = false;
    let lastW = 0, lastH = 0;
    function layoutViewport() {
      layoutQueued = false;
      const vv = window.visualViewport;
      let occluded = 0;
      if (vv && vv.scale <= 1.01) {
        if (window.scrollY) window.scrollTo(0, 0);
        // Pinch-zoom also shrinks vv.height/offsetTop; don't mistake that
        // for keyboard occlusion.
        occluded = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
      }
      const kb = keyBar.hidden ? 0 : keyBar.offsetHeight;
      keyBar.style.bottom = occluded + "px";
      panesEl.style.top = barEl.offsetHeight + "px";
      panesEl.style.bottom = kb + "px";
      // Keyboard = pure visual shift: slide the panes up so the prompt line
      // stays visible above the key bar. No fit, no cols/rows change, no
      // PTY-resize round-trip on keyboard open/close — the top rows just
      // slide behind the top bar until the keyboard goes away.
      // Clamp the shift so the cursor row never slides behind the top bar —
      // on a fresh/cleared screen the prompt is in the TOP rows and a full
      // shift would hide exactly what the user is typing into.
      let shift = occluded;
      const a = sessions[active];
      if (a && occluded) {
        const rowH = a.pane.clientHeight / a.term.rows;
        shift = Math.min(occluded, Math.max(0, Math.floor(a.term.buffer.active.cursorY * rowH)));
      }
      panesEl.style.transform = shift ? "translateY(-" + shift + "px)" : "";
      // Refit only when the layout viewport really changed (orientation,
      // desktop window resize). The soft keyboard never alters
      // innerWidth/Height on iOS or modern Android, so it can't refit.
      if (window.innerWidth !== lastW || window.innerHeight !== lastH) {
        lastW = window.innerWidth; lastH = window.innerHeight;
        const s = sessions[active];
        if (s) s.fitAndResize();
      }
    }
    function scheduleLayout() {
      if (layoutQueued) return;
      layoutQueued = true;
      requestAnimationFrame(layoutViewport);
    }
    if (window.visualViewport) {
      window.visualViewport.addEventListener("resize", scheduleLayout);
      window.visualViewport.addEventListener("scroll", scheduleLayout);
    }
    window.addEventListener("resize", scheduleLayout);
    scheduleLayout();

    setInterval(refreshSlots, 5000);

    // Coming back to the foreground (mobile backgrounds kill sockets):
    // reconnect dead sessions immediately instead of waiting out the
    // exponential backoff, which can sit at 5s.
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState !== "visible") return;
      if (Conn.failures >= MAX_FAILURES) { refreshSlots(); return; }  // given up: reload only
      if (!Conn.ws || Conn.ws.readyState === WebSocket.CLOSING || Conn.ws.readyState === WebSocket.CLOSED) {
        Conn.reconnect();
      }
      refreshSlots();
    });

    // Publish the owner's font prefs so read-only viewers can mirror them.
    function postPrefs() {
      fetch("/webshell/private/api/prefs", {
        method: "POST", credentials: "same-origin",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: new URLSearchParams({
          csrf: CSRF, font_size: String(prefs.fontSize), font_family: prefs.fontFamily,
        }),
      }).catch(() => {});
    }

    // Apply font prefs live to all open sessions; refit the visible one.
    TermPrefs.wireControls(prefs, () => {
      sessions.forEach((s) => {
        if (s) { s.term.options.fontSize = prefs.fontSize; s.term.options.fontFamily = prefs.fontFamily; }
      });
      const a = sessions[active];
      if (a) a.fitAndResize();
      postPrefs();
    });

    postPrefs();
    Conn.connect();
    activate(0);
  </script>
</body>
</html>
